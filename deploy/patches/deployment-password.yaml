apiVersion: apps/v1
kind: Deployment
metadata:
  name: rillcache
spec:
  template:
    spec:
      securityContext:
        fsGroup: 65532
      volumes:
        - name: rillcache-auth
          secret:
            secretName: rillcache-auth
            defaultMode: 288 # 0440: root owner, pod fsGroup may read
            items:
              - key: requirepass
                path: requirepass
      containers:
        - name: rillcache
          args: [--requirepass-file, /run/secrets/rillcache/requirepass]
          volumeMounts:
            - name: rillcache-auth
              # Match the server's startup-only password for this container.
              mountPath: /run/secrets/rillcache/requirepass
              subPath: requirepass
              readOnly: true
          startupProbe:
            exec:
              command: [/rillcache, --healthcheck, "127.0.0.1:6379", --healthcheck-password-file, /run/secrets/rillcache/requirepass]
          readinessProbe:
            exec:
              command: [/rillcache, --healthcheck, "127.0.0.1:6379", --healthcheck-password-file, /run/secrets/rillcache/requirepass]
