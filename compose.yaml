services:
  rillcache:
    image: ghcr.io/macel94/rillcache:latest
    # Loopback on the host; the image itself listens on its container interface.
    ports:
      - "127.0.0.1:6379:6379"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 5s
    # In-memory by default. For append-only restart recovery, uncomment:
    # command: ["--appendonly", "yes", "--dir", "/data"]
    # volumes: [rillcache-data:/data]
    # and declare `volumes: { rillcache-data: {} }` at the file root.
    # There is no AOF rewrite/compaction, backup or replication.
