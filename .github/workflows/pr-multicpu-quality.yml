name: PR multi-CPU Valkey and Dragonfly performance

# Parallel per-workload cohorts: one build, one job per server/workload row, and a
# single aggregation job named exactly like the required context. Wall-clock
# feedback drops from ~31 minutes to roughly build + the slowest row + aggregation.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Open main PR whose current head is this dispatch ref
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-multicpu-valkey-${{ github.event.pull_request.number || inputs.pull_request }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  WORKLOADS: ping,set,get,set-nx-existing,set-xx-existing

jobs:
  context:
    name: Freeze the exact PR base and head
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      base: ${{ steps.context.outputs.base }}
      head: ${{ steps.context.outputs.head }}
      pr: ${{ steps.context.outputs.pr }}
    steps:
      - name: Validate the exact open PR and freeze its base and head identities
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          number = os.environ['PR_NUMBER']
          assert re.fullmatch(r'[1-9][0-9]*', number), 'invalid PR number'
          repo = os.environ['GITHUB_REPOSITORY']
          pr = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/pulls/{number}']))
          assert pr['state'] == 'open' and pr['base']['ref'] == 'main', 'not an open main PR'
          assert pr['base']['repo']['full_name'] == repo, 'wrong base repository'
          if os.environ['GITHUB_EVENT_NAME'] == 'pull_request':
              event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())['pull_request']
              assert event['head']['sha'] == pr['head']['sha'], 'superseded PR head'
              assert event['base']['sha'] == pr['base']['sha'], 'base advanced; update the PR'
              assert os.environ['GITHUB_REF'] == f'refs/pull/{number}/merge', 'not the tested merge ref'
          else:
              assert pr['head']['repo']['full_name'] == repo, 'dispatch requires an in-repository branch'
              assert pr['head']['sha'] == os.environ['GITHUB_SHA'], 'dispatch is not the current PR head'
              assert os.environ['GITHUB_REF'] == 'refs/heads/' + pr['head']['ref'], 'wrong dispatch branch'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for key, value in [('base', pr['base']['sha']), ('head', pr['head']['sha']), ('pr', number)]:
                  if key != 'pr':
                      assert re.fullmatch(r'[0-9a-f]{40}', value), 'invalid source identity'
                  out.write(f'{key}={value}\n')
          PY

  build:
    name: Build frozen benchmark binaries
    needs: context
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.base }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Require the checked source to contain the exact current base
        env:
          BASE_SOURCE: ${{ needs.context.outputs.base }}
        run: git -C candidate merge-base --is-ancestor "$BASE_SOURCE" HEAD
      - name: Toolchain and build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-upgrade --no-install-recommends build-essential tcl curl ca-certificates
          rustup show active-toolchain
      - name: Build checksum-pinned official Valkey server and benchmark once
        working-directory: base
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          rustc -vV > "$RUNNER_TEMP/tools/compiler.txt"
          version=$(awk '$1 == "VALKEY_VERSION" {print $3}' benchmarks/targets.mk)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          make "$PWD/target/competitors/valkey-$version/src/valkey-server"
          make -C "target/competitors/valkey-$version/src" -j2 valkey-benchmark
          cp "target/competitors/valkey-$version/src/valkey-server" "$RUNNER_TEMP/tools/valkey"
          cp "target/competitors/valkey-$version/src/valkey-benchmark" "$RUNNER_TEMP/tools/generator"
          sha256sum "target/competitors/valkey-$version/src/valkey-benchmark.c" > "$RUNNER_TEMP/tools/benchmark-source.sha256"
          cp benchmarks/targets.mk "$RUNNER_TEMP/tools/reference-pins.mk"
          printf '%s\n' "$version" > "$RUNNER_TEMP/tools/valkey-version.txt"
      - name: Download checksum-pinned Dragonfly release and its BSL notice
        working-directory: base
        env:
          BASE_SOURCE: ${{ needs.context.outputs.base }}
          CANDIDATE_DIR: ${{ github.workspace }}/candidate
        run: |
          directory="$RUNNER_TEMP/tools"
          pins=benchmarks/targets.mk
          notice=benchmarks/notices/Dragonfly-BSL-1.1.txt
          if ! grep -q '^DRAGONFLY_VERSION' "$pins"; then
            [[ "$BASE_SOURCE" == acc875c57a5c09f82c28ef086a87c3ac9223faad ]]
            pins="$CANDIDATE_DIR/benchmarks/targets.mk"
            notice="$CANDIDATE_DIR/benchmarks/notices/Dragonfly-BSL-1.1.txt"
          fi
          version=$(awk '$1 == "DRAGONFLY_VERSION" {print $3}' "$pins")
          expected=$(awk '$1 == "DRAGONFLY_SHA256" {print $3}' "$pins")
          url="https://github.com/dragonflydb/dragonfly/releases/download/v${version}/dragonfly-x86_64.tar.gz"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$expected" =~ ^[0-9a-f]{64}$ ]]
          curl --proto '=https' --tlsv1.2 --fail --location --show-error --retry 3 \
            --connect-timeout 10 --max-time 180 "$url" -o "$RUNNER_TEMP/dragonfly.tar.gz"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/dragonfly.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/dragonfly.tar.gz" -C "$RUNNER_TEMP"
          binary=$(find "$RUNNER_TEMP" -maxdepth 1 -type f -name 'dragonfly*' ! -name '*.tar.gz' | head -1)
          [[ -n "$binary" && -x "$binary" ]]
          mv "$binary" "$directory/dragonfly"
          cp "$notice" "$directory/license.txt"
          "$directory/dragonfly" --version > "$directory/dragonfly-version.txt" 2>&1
          grep -qi "dragonfly.*v${version}" "$directory/dragonfly-version.txt"
          printf '%s\n' "$version" > "$directory/dragonfly-pin.txt"
      - name: Build the Rillcache candidate normally with the same pinned compiler
        working-directory: candidate
        run: |
          toolchain=$(rustup show active-toolchain | awk '{print $1}')
          cargo "+$toolchain" build --locked --offline --release --bin rillcache
          cp target/release/rillcache "$RUNNER_TEMP/tools/candidate"
          target/release/rillcache --version > "$RUNNER_TEMP/tools/candidate-version.txt"
      - name: Freeze hashes and allocated hardware identity
        env:
          BASE_SOURCE: ${{ needs.context.outputs.base }}
          HEAD_SOURCE: ${{ needs.context.outputs.head }}
        run: |
          cd "$RUNNER_TEMP/tools"
          sha256sum candidate valkey generator dragonfly > hashes.sha256
          python3 - <<'PY'
          import hashlib, json, os, platform
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'tools'
          hashes = {}
          for line in (root / 'hashes.sha256').read_text().splitlines():
              digest, name = line.split()
              hashes[Path(name).name] = digest
          record = {
              'base_source': os.environ['BASE_SOURCE'],
              'head_source': os.environ['HEAD_SOURCE'],
              'candidate_source': os.environ['GITHUB_SHA'],
              'valkey_version': (root / 'valkey-version.txt').read_text().strip(),
              'dragonfly_version': (root / 'dragonfly-pin.txt').read_text().strip(),
              'binary_sha256': hashes,
              'runner': os.environ.get('RUNNER_NAME'),
              'kernel': platform.release(),
          }
          (root / 'binaries.json').write_text(json.dumps(record, indent=2, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multicpu-binaries-${{ needs.context.outputs.pr }}-${{ github.sha }}
          path: ${{ runner.temp }}/tools
          retention-days: 7

  benchmark:
    name: ${{ matrix.server }} ${{ matrix.workload }} row
    needs: [context, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        server: [valkey, dragonfly]
        workload: [ping, set, get, set-nx-existing, set-xx-existing]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.base }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
      - name: Select the protected harness from the base branch
        id: harness
        env:
          BASE_SOURCE: ${{ needs.context.outputs.base }}
        run: |
          if [[ "${{ matrix.server }}" == valkey ]]; then
            harness="$GITHUB_WORKSPACE/base/scripts/pr-multicpu-performance.py"
            if [[ ! -f "$harness" ]]; then
              [[ "$BASE_SOURCE" == d94bd4e97906e517c30d056ddd2be24c0714f315 ]]
              harness="$GITHUB_WORKSPACE/candidate/scripts/pr-multicpu-performance.py"
            fi
          else
            harness="$GITHUB_WORKSPACE/base/scripts/pr-dragonfly-performance.py"
            if [[ ! -f "$harness" ]]; then
              [[ "$BASE_SOURCE" == acc875c57a5c09f82c28ef086a87c3ac9223faad ]]
              harness="$GITHUB_WORKSPACE/candidate/scripts/pr-dragonfly-performance.py"
            fi
          fi
          echo "path=$harness" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v5.0.0
        with:
          name: multicpu-binaries-${{ needs.context.outputs.pr }}-${{ github.sha }}
          path: ${{ runner.temp }}/tools
      - name: Verify every binary before timing anything
        run: |
          cd "$RUNNER_TEMP/tools"
          # Artifact transport does not preserve the executable bit; restore it
          # before hashing (content hashes are mode-independent and unchanged).
          chmod +x candidate valkey generator dragonfly
          sha256sum --check hashes.sha256
      - name: Resolve the pinned reference version from the frozen build
        id: reference
        run: |
          if [[ "${{ matrix.server }}" == valkey ]]; then
            echo "version=$(cat "$RUNNER_TEMP/tools/valkey-version.txt")" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(cat "$RUNNER_TEMP/tools/dragonfly-pin.txt")" >> "$GITHUB_OUTPUT"
          fi
      - name: Measure one workload with both servers alternating
        env:
          HARNESS: ${{ steps.harness.outputs.path }}
          BASE_SOURCE: ${{ needs.context.outputs.base }}
          HEAD_SOURCE: ${{ needs.context.outputs.head }}
        run: |
          # The harness creates its own output directory and refuses an existing
          # one, so never pre-create it here.
          set +e
          python3 "$HARNESS" \
            --candidate "$RUNNER_TEMP/tools/candidate" \
            ${{ matrix.server == 'valkey' && '--valkey' || '--dragonfly' }} "$RUNNER_TEMP/tools/${{ matrix.server }}" \
            --generator "$RUNNER_TEMP/tools/generator" \
            --base-source "$BASE_SOURCE" --candidate-source "$GITHUB_SHA" --head-source "$HEAD_SOURCE" \
            ${{ matrix.server == 'valkey' && '--valkey-version' || '--dragonfly-version' }} "${{ steps.reference.outputs.version }}" \
            ${{ matrix.server == 'dragonfly' && '--license "$RUNNER_TEMP/tools/license.txt"' || '' }} \
            --workloads "${{ matrix.workload }}" \
            --out "evidence/${{ matrix.server }}-${{ matrix.workload }}"
          status=$?
          set -e
          if [[ "${{ matrix.server }}" == dragonfly ]]; then
            # A complete diagnostic cohort may exit nonzero on a loss. Incomplete
            # or corrupt evidence must still fail closed.
            python3 - "evidence/dragonfly-${{ matrix.workload }}" <<'PY'
          import json, sys
          from pathlib import Path
          manifest = json.loads((Path(sys.argv[1]) / "manifest.json").read_text())
          assert manifest["complete"] is True
          PY
            exit 0
          fi
          exit "$status"
      - name: Revalidate this partial cohort from its raw CSV
        if: success() || failure()
        env:
          HARNESS: ${{ steps.harness.outputs.path }}
        run: |
          set +e
          python3 "$HARNESS" --check "evidence/${{ matrix.server }}-${{ matrix.workload }}" >check.out 2>&1
          status=$?
          set -e
          if [[ "${{ matrix.server }}" == dragonfly ]]; then
            # --check exits 1 for a complete losing row; corruption raises and
            # does not print a FAIL summary. A complete manifest is required.
            if [[ "$status" -ne 0 ]]; then
              grep -q 'FAIL:' check.out || { cat check.out; exit 1; }
            fi
            cat check.out
            python3 - "evidence/dragonfly-${{ matrix.workload }}" <<'PY'
          import json, sys
          from pathlib import Path
          manifest = json.loads((Path(sys.argv[1]) / "manifest.json").read_text())
          assert manifest["complete"] is True
          PY
          else
            cat check.out
            exit "$status"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: multicpu-partial-${{ matrix.server }}-${{ matrix.workload }}-${{ needs.context.outputs.pr }}-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/${{ matrix.server }}-${{ matrix.workload }}
          retention-days: 30
          if-no-files-found: warn

  gate:
    name: Valkey 4-CPU performance gate
    needs: [context, build, benchmark]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.base }}
          path: base
          persist-credentials: false
      - name: Fail closed when any per-row job did not succeed
        env:
          MATRIX_RESULT: ${{ needs.benchmark.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          [[ "$BUILD_RESULT" == success ]] || { echo "build job: $BUILD_RESULT"; exit 1; }
          [[ "$MATRIX_RESULT" == success ]] || { echo "per-row jobs: $MATRIX_RESULT"; exit 1; }
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v5.0.0
        with:
          pattern: multicpu-partial-*-${{ needs.context.outputs.pr }}-${{ github.sha }}-${{ github.run_attempt }}
          path: partials
      - name: Merge and revalidate the Valkey cohort
        env:
          BASE_SOURCE: ${{ needs.context.outputs.base }}
        run: |
          mapfile -t dirs < <(find partials -maxdepth 1 -mindepth 1 -type d -name 'multicpu-partial-valkey-*' | sort)
          [[ "${#dirs[@]}" -eq 5 ]] || { echo "expected 5 Valkey partials, found ${#dirs[@]}"; exit 1; }
          args=(); for dir in "${dirs[@]}"; do args+=(--partial "$dir"); done
          python3 base/scripts/merge-multicpu-gates.py \
            --harness base/scripts/pr-multicpu-performance.py "${args[@]}" \
            --out evidence/valkey
          python3 base/scripts/merge-multicpu-gates.py \
            --harness base/scripts/pr-multicpu-performance.py "${args[@]}" \
            --check evidence/valkey
      - name: Merge the diagnostic Dragonfly cohort
        run: |
          mapfile -t dirs < <(find partials -maxdepth 1 -mindepth 1 -type d -name 'multicpu-partial-dragonfly-*' | sort)
          [[ "${#dirs[@]}" -eq 5 ]] || { echo "expected 5 Dragonfly partials, found ${#dirs[@]}"; exit 1; }
          args=(); for dir in "${dirs[@]}"; do args+=(--partial "$dir"); done
          set +e
          python3 base/scripts/merge-multicpu-gates.py \
            --harness base/scripts/pr-dragonfly-performance.py "${args[@]}" \
            --out evidence/dragonfly
          status=$?
          set -e
          if [[ "$status" -ne 0 && "$status" -ne 1 ]]; then
            echo "Dragonfly merge failed with status $status"
            exit 1
          fi
          # Merge already revalidated every partial; accept a complete losing
          # cohort but never missing, partial or corrupt evidence.
          python3 - evidence/dragonfly <<'PY'
          import json, sys
          from pathlib import Path
          manifest = json.loads((Path(sys.argv[1]) / "manifest.json").read_text())
          assert manifest["complete"] is True
          PY
      - name: Publish both merged tables, including losses
        if: always()
        run: |
          for file in evidence/valkey/summary.md evidence/dragonfly/summary.md; do
            if [[ -f "$file" ]]; then
              if [[ "$file" == *dragonfly* ]]; then
                printf '**DIAGNOSTIC: Dragonfly rows and every loss are published below; only the ten Valkey medians decide this required check.**\n\n' >> "$GITHUB_STEP_SUMMARY"
              fi
              tee -a "$GITHUB_STEP_SUMMARY" < "$file"
            else
              printf 'Missing merged table: %s\n' "$file" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: multicpu-merged-${{ needs.context.outputs.pr }}-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 30
          if-no-files-found: warn
