name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  upgrade-rollback-drill:
    name: Upgrade and rollback drill
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the repository-pinned minimal Rust toolchain
        run: rustup show active-toolchain
      - name: Offline drill-harness tests
        run: python3 -m unittest scripts.test_upgrade_drill -v
      - name: Build the current head binaries
        run: |
          mkdir -p target/upgrade/new
          cargo build --release --locked --offline --bin rillcache --bin rillcache-backup
          cp target/release/rillcache target/release/rillcache-backup target/upgrade/new/
      - name: Build the pinned baseline binaries from the recorded commit
        run: |
          OLD=$(python3 -c "import json;print(json.load(open('ci/upgrade-pins.json'))['pair']['old']['commit'])")
          git rev-parse --verify "$OLD^{commit}"
          git worktree add "$RUNNER_TEMP/baseline" "$OLD"
          (cd "$RUNNER_TEMP/baseline" && cargo build --release --locked --offline --bin rillcache --bin rillcache-backup)
          mkdir -p target/upgrade/old
          cp "$RUNNER_TEMP/baseline/target/release/rillcache" "$RUNNER_TEMP/baseline/target/release/rillcache-backup" target/upgrade/old/
      - name: Upgrade, downgrade, failed upgrade and rollback with exact binaries
        run: python3 scripts/upgrade_drill.py --old target/upgrade/old --new target/upgrade/new --output target/upgrade-drill
      - name: Preserve the pair, journal digests and failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-rollback-drill-${{ github.sha }}
          path: target/upgrade-drill/
          retention-days: 30
          if-no-files-found: warn

  restore-drill:
    name: Isolated backup/restore drill
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the repository-pinned minimal Rust toolchain
        run: rustup show active-toolchain
      - name: Offline drill-harness tests
        run: python3 -m unittest scripts.test_restore_drill -v
      - name: Build the server and the offline backup tool
        run: cargo build --release --locked --offline --bins
      - name: Quiescent copy, isolated restore, retention and measured RPO/RTO
        run: python3 scripts/restore_drill.py --server target/release/rillcache --backup target/release/rillcache-backup --output target/restore-drill
      - name: Preserve drill results and failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: restore-drill-${{ github.sha }}
          path: target/restore-drill/
          retention-days: 30
          if-no-files-found: warn

  storage-faults:
    name: Real storage-fault drill
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the repository-pinned minimal Rust toolchain
        run: rustup show active-toolchain
      - name: Bounded tmpfs ENOSPC, short-write and rewrite-fault drills
        env:
          RILLCACHE_MOUNT_FAULTS: '1'
        run: make test-storage-faults
      - name: Preserve fault evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storage-faults-${{ github.sha }}
          path: target/release/deps/durability_faults-*
          retention-days: 14
          if-no-files-found: warn

  verify:
    name: Tests and offline CI
    needs: [storage-faults, restore-drill, upgrade-rollback-drill]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the repository-pinned minimal Rust toolchain
        run: rustup show active-toolchain
      - name: Same local checks and per-client, one-worker, four-worker test/benchmark matrix
        run: make ci
      - name: Package successful main builds for immediate testing
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: make package
      - name: Benchmark evidence (not a timing gate)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-smoke-${{ github.sha }}
          path: target/benchmarks/
          if-no-files-found: warn
          retention-days: 14
      - name: Deliver tested Linux binaries and checksum
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rillcache-linux-x86_64-${{ github.sha }}
          path: target/dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
