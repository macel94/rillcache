name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  verify:
    name: Tests and offline CI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the repository-pinned minimal Rust toolchain
        run: rustup show active-toolchain
      - name: Same local checks and per-client, one-worker, four-worker test/benchmark matrix
        run: make ci
      - name: Package successful main builds for immediate testing
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: make package
      - name: Benchmark evidence (not a timing gate)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-smoke-${{ github.sha }}
          path: target/benchmarks/
          if-no-files-found: warn
          retention-days: 14
      - name: Deliver tested Linux binaries and checksum
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rillcache-linux-x86_64-${{ github.sha }}
          path: target/dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
