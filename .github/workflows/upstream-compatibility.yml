name: Upstream Tcl compatibility

on:
  pull_request:
  workflow_dispatch:
    inputs:
      hash_diagnostic:
        description: Also run the original hash suite against each pinned reference and Rillcache
        type: boolean
        default: false
      redis_py_tls:
        description: Run pinned redis-py with native TLS and endpoint identity checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: upstream-tcl-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: '2'
  SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    name: Build pinned TCP compatibility tools
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lightweight harness tests (no server builds or workloads)
        run: python3 -m unittest discover -s scripts/upstream -p 'test_*.py' -v
      - name: Native build and Tcl prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config tcl curl ca-certificates time util-linux
      - name: Cache pinned source archives only (validated again on every use)
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: target/upstream-downloads
          key: upstream-source-v1-${{ hashFiles('ci/upstream/pins.json') }}
      - name: Release locked candidate and fresh native core builds
        run: python3 scripts/upstream/prepare.py --bundle
      - name: Preserve build evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-tcl-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/upstream/evidence/
          retention-days: 30
          if-no-files-found: warn
      - name: Share exact binaries and original upstream Tcl trees within this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-tcp-tools-${{ github.run_id }}
          path: target/upstream/bundle.tar.gz
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  command-matrix:
    name: Declared compatibility profile matrix
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: upstream-tcp-tools-${{ github.run_id }}
          path: target/upstream/
      - name: Unpack same-run tools
        run: tar -xzf target/upstream/bundle.tar.gz -C target/upstream
      - name: Validate the versioned profile offline
        run: python3 scripts/upstream/profile_matrix.py --check
      - name: Execute every declared row, exclusion and client row on both pinned references
        run: python3 scripts/upstream/profile_matrix.py --output target/upstream/evidence/profile-matrix --candidate target/upstream/rillcache
      - name: Preserve per-row results, frozen divergences and failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-profile-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/upstream/evidence/profile-matrix/
          retention-days: 30
          if-no-files-found: warn

  client-matrix:
    name: Pinned language-client matrix
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: upstream-tcp-tools-${{ github.run_id }}
          path: target/upstream/
      - name: Unpack same-run tools
        run: tar -xzf target/upstream/bundle.tar.gz -C target/upstream
      - name: Validate the versioned client matrix offline
        run: python3 scripts/upstream/client_matrix.py --check
      - name: Install the hash-pinned redis-py wheel
        run: |
          python3 -m venv target/client-venv
          target/client-venv/bin/python -m pip install --require-hashes --only-binary=:all: --no-deps -r scripts/redis-py-requirements.txt
      - name: Install the integrity-pinned node-redis package
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix ci/clients/node-redis
      - name: Build the checksum-pinned go-redis harness
        working-directory: ci/clients/go-redis
        env:
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
        run: go version && go build -o rillcache-client-matrix .
      - name: Execute every declared client case on fresh candidate listeners
        run: PATH="$PWD/target/client-venv/bin:$PWD/ci/clients/go-redis:$PATH" python3 scripts/upstream/client_matrix.py --output target/upstream/evidence/client-matrix --candidate target/upstream/rillcache
      - name: Preserve per-client results, logs and failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-client-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/upstream/evidence/client-matrix/
          retention-days: 30
          if-no-files-found: warn

  replication-exclusion:
    name: Replication exclusion vs pinned replicas
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: upstream-tcp-tools-${{ github.run_id }}
          path: target/upstream/
      - name: Unpack same-run tools
        run: tar -xzf target/upstream/bundle.tar.gz -C target/upstream
      - name: Pinned Redis and Valkey replicas must not link to the standalone candidate
        run: python3 scripts/upstream/replication_exclusion.py
      - name: Preserve every probe and failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-replication-exclusion-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/upstream/evidence/replication-exclusion/
          retention-days: 30
          if-no-files-found: warn

  acl-matrix:
    name: ACL allow/deny matrix
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lightweight ACL matrix policy tests
        working-directory: scripts/upstream
        run: python3 -m unittest test_acl_matrix -v
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: upstream-tcp-tools-${{ github.run_id }}
          path: target/upstream/
      - name: Unpack same-run tools
        run: tar -xzf target/upstream/bundle.tar.gz -C target/upstream
      - name: Validate the versioned matrix offline
        run: python3 scripts/upstream/acl_matrix.py --check
      - name: Every scenario on the candidate and both pinned references
        run: python3 scripts/upstream/acl_matrix.py --output target/upstream/evidence/acl-matrix
      - name: Preserve per-scenario decisions, state and failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-acl-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/upstream/evidence/acl-matrix/
          retention-days: 30
          if-no-files-found: warn

  suites:
    name: Tcl ${{ matrix.reference }} / ${{ matrix.suite.id }}
    needs: [build, command-matrix, client-matrix, replication-exclusion, acl-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        reference: [redis, valkey]
        suite:
          - {id: string, path: unit/type/string}
          - {id: incr, path: unit/type/incr}
          - {id: keyspace, path: unit/keyspace}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tcl runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tcl
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upstream-tcp-tools-${{ github.run_id }}
          path: target/upstream/
      - name: Unpack same-run tools
        run: tar -xzf target/upstream/bundle.tar.gz -C target/upstream
      - name: Native control first, then identical candidate suite/options over TCP
        env:
          REFERENCE: ${{ matrix.reference }}
          SUITE: ${{ matrix.suite.path }}
        run: python3 scripts/upstream/compatibility.py --reference "$REFERENCE" --suite "$SUITE"
      - name: Preserve both endpoints, counts, prerequisites, exclusions and unreached tests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-tcl-${{ matrix.reference }}-${{ matrix.suite.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/upstream/evidence/
          retention-days: 30
          if-no-files-found: warn

  hash-diagnostic:
    name: Tcl hash diagnostic
    if: github.event_name != 'pull_request' && github.event_name == 'workflow_dispatch' && inputs.hash_diagnostic
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        reference: [redis, valkey]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tcl runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tcl
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upstream-tcp-tools-${{ github.run_id }}
          path: target/upstream/
      - name: Unpack same-run tools
        run: tar -xzf target/upstream/bundle.tar.gz -C target/upstream
      - name: Run native hash control before candidate over TCP
        env:
          REFERENCE: ${{ matrix.reference }}
        run: python3 scripts/upstream/compatibility.py --reference "$REFERENCE" --suite unit/type/hash --diagnostic
      - name: Preserve manual hash diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-tcl-hash-diagnostic-${{ matrix.reference }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/upstream/evidence/compat-*-unit-type-hash/
          retention-days: 30
          if-no-files-found: warn

  redis-py-tls:
    name: redis-py TLS diagnostic
    if: github.event_name != 'pull_request' && github.event_name == 'workflow_dispatch' && inputs.redis_py_tls
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: upstream-tcp-tools-${{ github.run_id }}
          path: target/upstream/
      - name: Unpack same-run tools
        run: tar -xzf target/upstream/bundle.tar.gz -C target/upstream
      - name: Install the hash-pinned client wheel and test TLS identity
        run: |
          python3 -m venv target/redis-py-venv
          target/redis-py-venv/bin/python -m pip install --require-hashes --only-binary=:all: --no-deps -r scripts/redis-py-requirements.txt
          target/redis-py-venv/bin/python scripts/redis_py_conformance.py --server target/upstream/rillcache --tls
      - name: Preserve client results and server logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-redis-py-tls-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/upstream/redis-py-conformance/
          retention-days: 30
          if-no-files-found: warn
