name: Upstream Tcl compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-tcl-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: '2'
  SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    name: Build pinned TCP compatibility tools
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lightweight harness tests (no server builds or workloads)
        run: python3 -m unittest discover -s scripts/upstream -p 'test_*.py' -v
      - name: Native build and Tcl prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config tcl curl ca-certificates time util-linux
      - name: Cache pinned source archives only (validated again on every use)
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: target/upstream-downloads
          key: upstream-source-v1-${{ hashFiles('ci/upstream/pins.json') }}
      - name: Release locked candidate and fresh native core builds
        run: python3 scripts/upstream/prepare.py --bundle
      - name: Preserve build evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-tcl-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/upstream/evidence/
          retention-days: 30
          if-no-files-found: warn
      - name: Share exact binaries and original upstream Tcl trees within this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-tcp-tools-${{ github.run_id }}
          path: target/upstream/bundle.tar.gz
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  suites:
    name: Tcl ${{ matrix.reference }} / ${{ matrix.suite.id }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        reference: [redis, valkey]
        suite:
          - {id: string, path: unit/type/string}
          - {id: incr, path: unit/type/incr}
          - {id: keyspace, path: unit/keyspace}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tcl runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tcl
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: upstream-tcp-tools-${{ github.run_id }}
          path: target/upstream/
      - name: Unpack same-run tools
        run: tar -xzf target/upstream/bundle.tar.gz -C target/upstream
      - name: Native control first, then identical candidate suite/options over TCP
        env:
          REFERENCE: ${{ matrix.reference }}
          SUITE: ${{ matrix.suite.path }}
        run: python3 scripts/upstream/compatibility.py --reference "$REFERENCE" --suite "$SUITE"
      - name: Preserve both endpoints, counts, prerequisites, exclusions and unreached tests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-tcl-${{ matrix.reference }}-${{ matrix.suite.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/upstream/evidence/
          retention-days: 30
          if-no-files-found: warn
