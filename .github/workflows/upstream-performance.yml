name: Upstream generator performance

# Daily advisory comparisons stay separate from every protected PR check.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      reactor_diagnostic:
        description: 'Same-job hosted baseline/candidate PING and GET diagnostic, not fixed-host screening or a gate'
        type: boolean
        default: false
      reactor_base:
        description: 'Exact baseline SHA for the reactor diagnostic'
        type: string
      daily:
        description: 'Complete five-server daily comparison (disable for the legacy three-server study)'
        type: boolean
        default: true
      study:
        description: 'Advisory matched PING screening on the isolated rillcache-perf runner'
        type: boolean
        default: false
      study_base:
        description: 'Exact baseline source SHA (study only)'
        type: string
      study_candidate:
        description: 'Exact candidate source SHA (study only)'
        type: string
      study_hardware_sha256:
        description: 'Preselected hardware/software fingerprint; mismatch fails before builds'
        type: string
      study_profiles:
        description: 'Add separate owned-process P1 profiles after normal screening'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: upstream-performance-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: '2'
  SOURCE_HEAD_SHA: ${{ github.sha }}

jobs:
  reactor-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.reactor_diagnostic }}
    name: Same-job reactor baseline candidate diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Lightweight diagnostic tests
        run: python3 -m unittest discover -s scripts/upstream -p 'test_*.py' -v
      - name: Native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config tcl curl ca-certificates util-linux
      - name: Freeze allocated hardware and software identity before builds
        id: machine
        run: |
          mkdir -p target/upstream/evidence/reactor-preflight
          python3 scripts/dev_hardware.py > target/upstream/evidence/reactor-preflight/hardware.json
          python3 -c 'import json; print("fingerprint=" + json.load(open("target/upstream/evidence/reactor-preflight/hardware.json"))["fingerprint"])' >> "$GITHUB_OUTPUT"
      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: target/upstream-downloads
          key: reactor-source-v1-${{ hashFiles('ci/upstream/pins.json') }}
      - name: Fresh production builds and matched P1 P16 default and explicit one/four-worker controls
        env:
          BASE: ${{ inputs.reactor_base }}
          HARDWARE: ${{ steps.machine.outputs.fingerprint }}
        run: |
          python3 scripts/reactor-study.py --base "$BASE" --candidate "$GITHUB_SHA" --expected-hardware "$HARDWARE"
          python3 scripts/reactor-study.py --check target/upstream/evidence/reactor-study
      - name: Retain frozen controls and every result including losses
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reactor-study-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/upstream/evidence/
          retention-days: 30
          if-no-files-found: warn

  daily:
    if: ${{ !inputs.reactor_diagnostic && !inputs.study && (github.event_name == 'schedule' || inputs.daily) }}
    name: Daily Rillcache Redis Valkey Dragonfly Garnet comparison
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lightweight harness tests
        run: python3 -m unittest discover -s scripts/upstream -p 'test_*.py' -v
      - name: Native build and resource-accounting prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config tcl curl ca-certificates time util-linux xz-utils libicu-dev libaio-dev liburing-dev
      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: target/upstream-downloads
          key: daily-source-v1-${{ hashFiles('ci/upstream/pins.json', 'ci/daily-pins.json') }}
      - name: Build pinned core servers and prepare verified Dragonfly Garnet and private .NET runtime
        run: python3 scripts/upstream/daily_prepare.py
      - name: Check every server's startup and command semantics before timed traffic
        run: python3 scripts/upstream/daily.py --smoke
      - name: Same-host sequential five-server comparison with balanced order
        run: python3 scripts/upstream/daily.py
      - name: Independently revalidate every raw sample and ranking
        run: python3 scripts/upstream/daily.py --check target/upstream/evidence/daily
      - name: Preserve all raw evidence and failures, never downloaded executables
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daily-five-server-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/upstream/evidence/
          retention-days: 30
          if-no-files-found: warn

  compare:
    if: ${{ github.event_name != 'schedule' && !inputs.reactor_diagnostic && !inputs.study && !inputs.daily }}
    name: Same-runner Redis Valkey Rillcache comparison
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lightweight harness tests
        run: python3 -m unittest discover -s scripts/upstream -p 'test_*.py' -v
      - name: Native build, Tcl and resource-accounting prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config tcl curl ca-certificates time util-linux
      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: target/upstream-downloads
          key: upstream-source-v1-${{ hashFiles('ci/upstream/pins.json') }}
      - name: Build exact Cargo release target and both pinned native core servers
        run: python3 scripts/upstream/prepare.py
      - name: Sequential matched load, warmup and six rotating-order repetitions
        run: python3 scripts/upstream/performance.py
      - name: Preserve raw measurements, failures, build logs and environment metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/upstream/evidence/
          retention-days: 30
          if-no-files-found: warn

  study:
    if: inputs.study && !inputs.reactor_diagnostic
    name: Fixed-host matched PING screening
    runs-on: [self-hosted, Linux, X64, rillcache-perf]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the preselected host before builds or measurements
        env:
          EXPECTED_HARDWARE: ${{ inputs.study_hardware_sha256 }}
        run: |
          mkdir -p target/upstream/evidence/dev-performance-preflight
          python3 scripts/dev_hardware.py --expected-fingerprint "$EXPECTED_HARDWARE" \
            > target/upstream/evidence/dev-performance-preflight/hardware.json
      - name: Lightweight harness tests
        run: python3 -m unittest discover -s scripts/upstream -p 'test_*.py' -v
      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: target/upstream-downloads
          key: upstream-source-v1-${{ hashFiles('ci/upstream/pins.json') }}
      - name: Cache independently verified reference builds for the fixed host
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: target/dev-reference-cache
          key: dev-reference-v1-${{ inputs.study_hardware_sha256 }}-${{ hashFiles('Makefile', 'benchmarks/targets.mk', 'ci/upstream/pins.json') }}
      - name: Matched P1 and P16 screening; profiles only when requested
        env:
          STUDY_BASE: ${{ inputs.study_base }}
          STUDY_CANDIDATE: ${{ inputs.study_candidate }}
          EXPECTED_HARDWARE: ${{ inputs.study_hardware_sha256 }}
          STUDY_PROFILES: ${{ inputs.study_profiles }}
        run: |
          profile_args=()
          if [[ "$STUDY_PROFILES" == true ]]; then profile_args=(--profiles); fi
          python3 scripts/dev-performance.py --base "$STUDY_BASE" --candidate "$STUDY_CANDIDATE" \
            --expected-hardware "$EXPECTED_HARDWARE" "${profile_args[@]}"
          python3 scripts/dev-performance.py --check target/upstream/evidence/dev-performance
      - name: Preserve raw screening evidence and all failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/upstream/evidence/
          retention-days: 30
          if-no-files-found: warn
