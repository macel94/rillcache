name: PR154 matched asynchronous owner screen

# Isolated read-only diagnostics; never the PR's required-check definitions.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr154-async-owner-screen
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: '2'
  SOURCE_HEAD_SHA: ${{ github.sha }}

jobs:
  compare:
    if: github.ref == 'refs/heads/diagnostic/pr154-async-owner-study'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Offline advisory helper tests
        run: |
          python3 scripts/pr154-owner-study.py --self-test
          python3 -m unittest discover -s scripts/upstream -p 'test_dev_performance.py' -v
      - name: Native prerequisites, no host tuning
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config curl ca-certificates time util-linux
      - name: Exact runtime source, owner lifecycle and actual topology correctness
        run: |
          git diff --exit-code 868901bbaab0564524ea297cf66de8762b9a7522 -- Cargo.toml Cargo.lock src/ tests/ vendor/
          cargo test --locked --offline --lib server::tokio_io::
          cargo test --locked --offline --test server --test readiness --test transport_topology
      - name: Frozen normal-release matched study, including same-ELF Mio control
        run: |
          python3 -u scripts/pr154-owner-study.py
          python3 scripts/pr154-owner-study.py --check target/owner-study
      - name: Publish all medians and losses
        if: always()
        run: |
          if [[ -f target/owner-study/summary.md ]]; then
            tee -a "$GITHUB_STEP_SUMMARY" < target/owner-study/summary.md
          fi
          printf 'One advisory matched cohort only; not all40/all14 protected acceptance. No normal instrumentation.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain raw evidence including failures, never frozen/Dragonfly binaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr154-async-owner-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/owner-study/
          retention-days: 30
          if-no-files-found: warn
