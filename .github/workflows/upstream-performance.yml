name: PR154 matched Compio completion screen

# Isolated read-only diagnostic branch; no PR or required-check/publisher path.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr154-compio-screen
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: '2'
  SOURCE_HEAD_SHA: ${{ github.sha }}

jobs:
  compare:
    if: github.ref == 'refs/heads/diagnostic/pr154-compio-study'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Offline diagnostic helper tests
        run: |
          python3 scripts/pr154-compio-study.py --self-test
          python3 -m unittest discover -s scripts/upstream -p 'test_dev_performance.py' -v
      - name: Native prerequisites without host tuning
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config curl ca-certificates time util-linux
      - name: Require actual completion correctness before normal traffic
        run: |
          git diff --exit-code bf0ed14da3f14f7a5b77ee98d437e370747ad9ed -- Cargo.toml Cargo.lock src/ tests/ vendor/
          RILLCACHE_REQUIRE_COMPIO=1 cargo test --locked --offline --lib server::compio_io::tests
          RILLCACHE_TEST_THREADS=compio cargo test --locked --offline --test server --test readiness --test network_modes
      - name: Frozen matched uninstrumented normal-release screen
        run: |
          python3 -u scripts/pr154-compio-study.py
          python3 scripts/pr154-compio-study.py --check target/compio-study
      - name: Publish all medians including losses
        if: always()
        run: |
          if [[ -f target/compio-study/summary.md ]]; then
            tee -a "$GITHUB_STEP_SUMMARY" < target/compio-study/summary.md
          fi
          printf 'One matched advisory cohort; not all40/all14 protected acceptance. No profiles mixed into normal traffic.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain evidence including failures, never frozen/Dragonfly binaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr154-compio-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/compio-study/
          retention-days: 30
          if-no-files-found: warn
