name: PR154 matched deferred-read-probe screen

# Diagnostic branch only. No PR, required-check, publisher or privileged path.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr154-read-probe-screen
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: '2'
  SOURCE_HEAD_SHA: ${{ github.sha }}

jobs:
  compare:
    if: github.ref == 'refs/heads/diagnostic/pr154-read-probes'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Offline diagnostic and owned-process helper tests
        run: |
          python3 scripts/pr154-selector-study.py --self-test
          python3 -m unittest discover -s scripts/upstream -p 'test_dev_performance.py' -v
      - name: Native prerequisites without host tuning
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config curl ca-certificates time util-linux
      - name: Matched normal read-probe screen then separate owned-process profiles
        run: |
          python3 -u scripts/pr154-selector-study.py
          python3 scripts/pr154-selector-study.py --check target/selector-study
      - name: Publish complete normal medians including rejected candidates
        if: always()
        run: |
          if [[ -f target/selector-study/summary.md ]]; then
            tee -a "$GITHUB_STEP_SUMMARY" < target/selector-study/summary.md
          fi
      - name: Label instrumentation scope
        if: always()
        run: printf 'One hosted matched diagnostic only; never required merge acceptance.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain raw evidence including failures, never Dragonfly binaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr154-read-probes-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/selector-study/
          retention-days: 30
          if-no-files-found: warn
