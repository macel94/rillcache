name: PR154 owned syscall and CPU diagnosis

# Diagnostic branch only. No PR, required-check, publisher or privileged path.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr154-owned-profile-diagnosis
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: '2'
  SOURCE_HEAD_SHA: ${{ github.sha }}

jobs:
  compare:
    if: github.ref == 'refs/heads/diagnostic/pr154-selector-study'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Offline diagnostic and owned-process helper tests
        run: |
          python3 scripts/pr154-selector-study.py --self-test
          python3 -m unittest discover -s scripts/upstream -p 'test_dev_performance.py' -v
      - name: Native prerequisites without host tuning
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config curl ca-certificates time util-linux
      - name: Owned failed-source and Dragonfly profiles only, no normal retry
        run: python3 -u scripts/pr154-owned-profiles.py
      - name: Label instrumentation scope
        if: always()
        run: printf 'Owned-process instrumented diagnosis only; not normal throughput or merge acceptance.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain raw evidence including failures, never Dragonfly binaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr154-owned-profiles-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/owned-profiles/
          retention-days: 30
          if-no-files-found: warn
