name: Container image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  verify:
    runs-on: ubuntu-24.04
    # `make ci` runs the full offline suite plus the release benchmark smoke. A
    # 10-minute budget cancelled this required job mid-run under normal runner
    # load (PR #702 cancelled at 10m16s), which hides a real result behind an
    # infrastructure cancellation. Keep it above the parallel `Tests and offline
    # CI` job's budget so a failure, not a timeout, is what fails the check.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version tags against the real application version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(awk -F '"' '/^version = "/ {print $2; exit}' Cargo.toml)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo '::error::A release tag must equal v<Cargo package version>.'
            exit 1
          fi
      - name: Validate signed container evidence and vulnerability response policy
        run: python3 scripts/test_container_attestations.py
      - name: Same offline safety, dependency, mode and benchmark checks as normal CI
        run: make ci

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build a native, statically linked scratch image without publishing credentials
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: rillcache:tested-${{ matrix.arch }}
          build-args: VCS_REF=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.arch }}
      - name: Build only host-side test tools, never include them in the image
        run: cargo build --locked --offline --release --bin rillcache-bench
      - name: Test default networking, health, size, static linking and all three worker modes
        run: bash scripts/container-smoke.sh 'rillcache:tested-${{ matrix.arch }}'
      - name: Generate SPDX SBOM from the tested native image
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: rillcache:tested-${{ matrix.arch }}
          format: spdx-json
          output-file: target/rillcache-${{ matrix.arch }}.spdx.json
          syft-version: v1.57.2
          upload-artifact: false
          upload-release-assets: false
      - name: Export the exact tested image, not a subsequent rebuild
        run: docker image save 'rillcache:tested-${{ matrix.arch }}' -o 'target/image-${{ matrix.arch }}.tar'
      - name: Preserve the tested image and evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rillcache-container-${{ matrix.arch }}-${{ github.sha }}
          path: |
            target/image-${{ matrix.arch }}.tar
            target/rillcache-${{ matrix.arch }}.spdx.json
            target/container-smoke/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    concurrency:
      group: container-publication
      cancel-in-progress: false
    outputs:
      image: ${{ steps.publish.outputs.image }}
      image_name: ${{ steps.publish.outputs.image_name }}
      index_digest: ${{ steps.publish.outputs.index_digest }}
      amd64_digest: ${{ steps.publish.outputs.amd64_digest }}
      arm64_digest: ${{ steps.publish.outputs.arm64_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download only this run's exact tested images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rillcache-container-*-${{ github.sha }}
          path: target/images
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Authenticate with the short-lived workflow token, not a stored PAT
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish both tested architectures and a source-labelled manifest
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          sources=()
          amd64_digest=''
          arm64_digest=''
          for arch in amd64 arm64; do
            docker image load --input "target/images/image-$arch.tar"
            ref="$image:sha-$GITHUB_SHA-$arch"
            docker image tag "rillcache:tested-$arch" "$ref"
            docker image push "$ref"
            digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            if [[ "$arch" == amd64 ]]; then
              amd64_digest=$digest
            else
              arm64_digest=$digest
            fi
            sources+=("$image@$digest")
          done
          tags=(--tag "$image:sha-$GITHUB_SHA")
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation 'index:org.opencontainers.image.description=Experimental safe-std-only Rillcache; no authentication, TLS or persistence' \
            "${sources[@]}"
          ref="$image:sha-$GITHUB_SHA"
          digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$ref" --raw | jq -e \
            '([.manifests[].platform | .os + "/" + .architecture] | sort) == ["linux/amd64", "linux/arm64"]'
          echo "image_name=$image" >> "$GITHUB_OUTPUT"
          echo "image=$image@$digest" >> "$GITHUB_OUTPUT"
          echo "index_digest=$digest" >> "$GITHUB_OUTPUT"
          echo "amd64_digest=$amd64_digest" >> "$GITHUB_OUTPUT"
          echo "arm64_digest=$arm64_digest" >> "$GITHUB_OUTPUT"
          {
            echo '## Tested thin container image'
            echo
            echo "Digest-pinned image: \`$image@$digest\`"
            echo "linux/amd64 manifest: \`$amd64_digest\`"
            echo "linux/arm64 manifest: \`$arm64_digest\`"
            echo
            echo 'Both native architectures passed default/per-client, one-worker and four-worker tests.'
            echo 'The published multi-platform index has signed SLSA provenance; each tested platform manifest has a signed SPDX SBOM attestation.'
            echo 'A fresh read-only job verifies the registry attestations after an anonymous pull.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Sign provenance for the exact published multi-platform index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.image_name }}
          subject-digest: ${{ steps.publish.outputs.index_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Sign the tested amd64 image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.image_name }}
          subject-digest: ${{ steps.publish.outputs.amd64_digest }}
          sbom-path: target/images/rillcache-amd64.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Sign the tested arm64 image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.image_name }}
          subject-digest: ${{ steps.publish.outputs.arm64_digest }}
          sbom-path: target/images/rillcache-arm64.spdx.json
          push-to-registry: true
          create-storage-record: false

  public-pull:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require anonymous access to the exact published manifest
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          config=$(mktemp -d)
          trap 'rm -rf "$config"' EXIT
          if ! DOCKER_CONFIG="$config" docker image pull "$IMAGE"; then
            echo '::error::GHCR defaults new packages to PRIVATE. Open the repository Packages > rillcache > Package settings > Change visibility > Public, then rerun this job. No personal token is required.'
            exit 1
          fi
      - name: Verify signed provenance and both SPDX attestations without registry credentials
        env:
          IMAGE_NAME: ${{ needs.publish.outputs.image_name }}
          INDEX_DIGEST: ${{ needs.publish.outputs.index_digest }}
          AMD64_DIGEST: ${{ needs.publish.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ needs.publish.outputs.arm64_digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          config=$(mktemp -d)
          trap 'rm -rf "$config"' EXIT
          export DOCKER_CONFIG="$config"
          signer="$GITHUB_REPOSITORY/.github/workflows/container.yml"
          gh attestation verify "oci://$IMAGE_NAME@$INDEX_DIGEST" \
            --bundle-from-oci --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer" --source-digest "$SOURCE_SHA" \
            --deny-self-hosted-runners
          for digest in "$AMD64_DIGEST" "$ARM64_DIGEST"; do
            gh attestation verify "oci://$IMAGE_NAME@$digest" \
              --bundle-from-oci --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$signer" \
              --predicate-type https://spdx.dev/Document/v2.3 \
              --deny-self-hosted-runners
          done
      - name: Verify the public image really runs, with no publishing credential
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          cargo build --locked --offline --release --bin rillcache-bench
          bash scripts/container-smoke.sh "$IMAGE"

  promote:
    needs: [publish, public-pull]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    concurrency:
      group: container-promotion
      cancel-in-progress: false
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Authenticate with the short-lived workflow token, not a stored PAT
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Promote aliases only after anonymous verification of the signed digest
        env:
          IMAGE_NAME: ${{ needs.publish.outputs.image_name }}
          INDEX_DIGEST: ${{ needs.publish.outputs.index_digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tags=()
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
            if [[ "$head" == "$GITHUB_SHA" ]]; then
              tags+=(latest)
            else
              echo '::notice::An older source run cannot move latest backwards; signed source digest remains published.'
            fi
          else
            tags+=("$GITHUB_REF_NAME")
          fi
          for tag in "${tags[@]}"; do
            docker buildx imagetools create --tag "$IMAGE_NAME:$tag" "$IMAGE_NAME@$INDEX_DIGEST"
            promoted=$(docker buildx imagetools inspect "$IMAGE_NAME:$tag" --format '{{.Manifest.Digest}}')
            [[ "$promoted" == "$INDEX_DIGEST" ]] || {
              echo "::error::Alias $tag resolved to $promoted, expected $INDEX_DIGEST."
              exit 1
            }
          done
