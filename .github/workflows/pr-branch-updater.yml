name: PR branch updater

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [CI, PR Valkey quality gate, PR multi-CPU Valkey performance]
    types: [completed]

permissions:
  contents: read

jobs:
  read-only-self-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run offline mocked updater and report-delivery policy tests
        run: |
          python3 -m unittest scripts.test_pr_branch_updater -v
          python3 scripts/test-pr-policy.py
          python3 scripts/test-multicpu-performance.py

  reconcile:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    concurrency:
      group: pr-branch-updater-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Reconcile every eligible PR using trusted main code
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PR_UPDATE_OUTCOMES: ${{ runner.temp }}/pr-update-outcomes.json
        run: python3 scripts/update-pr-branches.py
      - name: Retain machine-readable per-PR outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-branch-updater-${{ github.run_id }}
          path: ${{ runner.temp }}/pr-update-outcomes.json
          if-no-files-found: warn
          retention-days: 90
