[package]
name = "rillcache"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A safe Redis-compatible server with vendored Tokio and rustls"
repository = "https://github.com/macel94/rillcache"
publish = false
default-run = "rillcache"
build = false

[workspace]
members = ["crates/rillcache-io"]

# Explicit exceptions: rustls, Tokio and CPU affinity with required transitives,
# plus the in-repo `rillcache-io` crate, which owns the repository's only unsafe
# code (Linux io_uring send batching) behind a safe API. Application code itself
# remains `#![forbid(unsafe_code)]`.
[dependencies]
core_affinity = "=0.8.3"
mio = { version = "=1.2.4", default-features = false, features = ["os-poll", "os-ext"] }
rillcache-io = { path = "crates/rillcache-io" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
tokio = { version = "=1.54.1", default-features = false, features = ["io-util", "net", "rt", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[[bench]]
name = "core"
harness = false

[profile.release]
# Keep overflow checks in optimized builds too. Measure before tuning further.
overflow-checks = true
# Whole-program optimization matters on the one-request pipeline: it inlines
# session dispatch, store access and RESP framing across module boundaries.
lto = "fat"
codegen-units = 1
