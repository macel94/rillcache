[package]
name = "rillcache"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A safe Redis-compatible server with vendored rustls and Mio"
repository = "https://github.com/macel94/rillcache"
publish = false
default-run = "rillcache"
build = false

# Explicit exceptions: rustls, Mio and their required transitive crates.
# Application code remains unsafe-free; dependencies expose safe OS/TLS APIs.
[dependencies]
mio = { version = "=1.2.4", default-features = false, features = ["os-poll", "os-ext"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[[bench]]
name = "core"
harness = false

[profile.release]
# Keep overflow checks in optimized builds too. Measure before tuning further.
overflow-checks = true
# Whole-program optimization matters on the one-request pipeline: it inlines
# session dispatch, store access and RESP framing across module boundaries.
lto = "fat"
codegen-units = 1
